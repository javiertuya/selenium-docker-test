name: selenium-test-dynamic-grid
services:
  dynamic-grid:
    image: selenium/standalone-docker:4.44.0-20260505
    container_name: dynamic-grid
    ports:
      - ${PORTS:-4444:4444}
    volumes:
      - ${PWD}/target/dynamic-grid-video-20260505:/opt/selenium/assets
      - ${PWD}/test-grid/config-20260505.toml:/opt/selenium/docker.toml
      - /var/run/docker.sock:/var/run/docker.sock
