name: selenium-test-dynamic-grid
services:
  dynamic-grid:
    image: selenium/standalone-docker:nightly
    container_name: dynamic-grid
    ports:
      - ${PORTS:-4444:4444}
    volumes:
      - ${PWD}/target/dynamic-grid-video-nightly:/opt/selenium/assets
      - ${PWD}/test-grid/config-nightly.toml:/opt/selenium/docker.toml
      - /var/run/docker.sock:/var/run/docker.sock
